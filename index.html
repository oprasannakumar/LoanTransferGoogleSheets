<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

body{
  font-family: 'Inter', Arial, sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f9fafb);
  padding:20px;
}

form{
  background:#ffffff;
  max-width:420px;
  margin:auto;
  padding:22px;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.08);
}

h3{
  text-align:center;
  margin-bottom:16px;
  font-weight:600;
}

label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-top:14px;
  color:#374151;
}

input, select, button{
  width:100%;
  height:44px;
  margin-top:6px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  box-sizing:border-box;
  font-size:14px;
}

input:focus, select:focus{
  outline:none;
  border-color:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.15);
}

button{
  background:#22c55e;
  color:#fff;
  border:none;
  margin-top:20px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#16a34a;
}

.hidden{display:none}
input:disabled{background:#f3f4f6}
</style>
</head>

<body>

<form id="loanForm">
  <h3>Loan Entry</h3>

  <label>Date</label>
  <input type="date" id="date" required>

  <label>Borrower</label>
  <select id="borrower" required>
    <option value="">Select</option>
    <option>Chinnama</option>
    <option>Grand Father</option>
    <option>Mother</option>
    <option>Pedhamma</option>
    <option>Ravi Babai</option>
    <option>Srinivas Babai</option>
    <option>Vasavi</option>
    <option>Other</option>
  </select>

  <input type="text" id="borrower_other" class="hidden" placeholder="Enter borrower name">

  <label>Narration</label>
  <input type="text" id="narration" required>

  <label>Invoice No.</label>
  <input type="text" id="invoice">

  <label>Transaction Type</label>
  <select id="trtype" required>
    <option value="">Select</option>
    <option value="loan_given">Loan Given</option>
    <option value="loan_received">Loan Received</option>
  </select>

  <label>Payment Mode</label>
  <select id="mode" required>
    <option value="">Select</option>
    <option value="cash">Cash</option>
    <option value="debit">Debit</option>
    <option value="upi">UPI</option>
    <option value="net">Net</option>
    <option value="credit">Credit</option>
  </select>

  <div id="accountBlock" class="hidden">
    <label>Account</label>
    <select id="account"></select>
  </div>

  <!-- Amount blocks (hidden initially) -->
  <div id="givenBlock" class="hidden">
    <label>Given Amount</label>
    <input type="number" id="given" step="0.01">
  </div>

  <div id="receivedBlock" class="hidden">
    <label>Received Amount</label>
    <input type="number" id="received" step="0.01">
  </div>

  <button type="submit">Save Loan</button>
</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfCBcJgtYYQobOQwD7f_3b4TLpA_Oj-kEZuua0rdAlY14NCY9BNWBfK_Os-Cw8uKEU/exec";

/* DOM elements */
const dateEl = document.getElementById("date");
const borrower = document.getElementById("borrower");
const borrowerOther = document.getElementById("borrower_other");
const narration = document.getElementById("narration");
const invoice = document.getElementById("invoice");
const trtype = document.getElementById("trtype");
const mode = document.getElementById("mode");
const accountBlock = document.getElementById("accountBlock");
const account = document.getElementById("account");
const given = document.getElementById("given");
const received = document.getElementById("received");
const givenBlock = document.getElementById("givenBlock");
const receivedBlock = document.getElementById("receivedBlock");

/* Accounts */
const bankAccounts = ["FI","HDFC Old","HDFC New","ICICI","RBL","Kotak","SBI","IndusInd"];
const creditCards = [
  "Axis Flipkart","Axis MyZone","Axis Neo",
  "HDFC PhonePe","HDFC Tata Neu","HDFC Millennia",
  "HSBC","IDFC First Millenia",
  "ICICI Amazon","ICICI Coral","ICICI Expressions",
  "Indusind Plat Aura EDGE","Indusind Legend",
  "Yes Finbooster","Kotak League","Kotak Image",
  "SBI BPCL","Standard Chartered"
];

/* Borrower Other logic */
borrower.addEventListener("change", () => {
  borrowerOther.classList.toggle("hidden", borrower.value !== "Other");
});

/* Account logic */
mode.addEventListener("change", () => {
  account.innerHTML = "";
  if (mode.value === "cash") {
    accountBlock.classList.add("hidden");
    return;
  }
  accountBlock.classList.remove("hidden");
  const list = mode.value === "credit" ? creditCards : bankAccounts;
  list.forEach(a => account.add(new Option(a, a)));
});

/* Enable / Disable + show/hide amounts */
trtype.addEventListener("change", () => {
  given.value = "";
  received.value = "";

  givenBlock.classList.add("hidden");
  receivedBlock.classList.add("hidden");

  if (trtype.value === "loan_given") {
    given.disabled = false;
    received.disabled = true;
    givenBlock.classList.remove("hidden");
  } else if (trtype.value === "loan_received") {
    received.disabled = false;
    given.disabled = true;
    receivedBlock.classList.remove("hidden");
  }
});

/* Date format */
function formatDateToDDMMMYYYY(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + "-" + months[d.getMonth()] + "-" + d.getFullYear();
}

/* Submit */
document.getElementById("loanForm").addEventListener("submit", e => {
  e.preventDefault();

  const payload = new URLSearchParams({
    category: "loan",
    date: formatDateToDDMMMYYYY(dateEl.value),
    borrower: borrower.value === "Other" ? borrowerOther.value : borrower.value,
    narration: narration.value,
    invoice: invoice.value,
    mode: mode.value,
    account: mode.value === "cash" ? "Cash" : account.value,
    withdrawn: given.value,
    deposit: received.value
  });

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: payload
  })
  .then(() => {
    alert("Loan saved successfully");
    e.target.reset();
    givenBlock.classList.add("hidden");
    receivedBlock.classList.add("hidden");
    accountBlock.classList.add("hidden");
    borrowerOther.classList.add("hidden");
  })
  .catch(() => alert("Error saving loan"));
});
</script>

</body>
</html>
