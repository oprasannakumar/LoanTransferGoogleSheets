<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Entry (Offline Capable)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
      padding: 20px;
      margin: 0;
    }

    form {
      background: #ffffff;
      max-width: 420px;
      margin: auto;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.08);
    }

    h3 {
      text-align: center;
      margin-bottom: 16px;
      margin-top: 0;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      display: block;
      color: #374151;
    }

    input, select, button {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      box-sizing: border-box;
      background: #fff;
      color: #111827;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }

    button {
      background: #22c55e;
      color: #fff;
      border: none;
      margin-top: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #16a34a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .hidden { display: none; }
    input:disabled { background: #f3f4f6; }

    /* Sync Indicator */
    #syncStatus {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .sync-pending { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
    .sync-success { background: #f0fdf4; color: #15803d; border: 1px solid #dcfce7; }
    .sync-progress { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }

    /* Cash Denominations */
    .cash-box {
      margin-top: 16px;
      padding: 18px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    .cash-title {
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 14px;
    }

    .denom-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .denom-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .denom-label {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .denom-card input {
      width: 100%;
      height: 38px;
      text-align: center;
      font-weight: 600;
    }

    /* Dark Mode */
    body.dark { background: linear-gradient(135deg, #020617, #0f172a); color: #e5e7eb; }
    body.dark form { background: #020617; box-shadow: 0 18px 40px rgba(0,0,0,.6); border: 1px solid #334155; }
    body.dark h3, body.dark label, body.dark .cash-title, body.dark .denom-label { color: #e5e7eb; }
    body.dark input, body.dark select { background: #020617; color: #f9fafb; border-color: #334155; }
    body.dark input::placeholder { color: #94a3b8; }
    body.dark button { background: #22c55e; color: #022c22; }
    body.dark .cash-box, body.dark .denom-card { background: #020617; border-color: #334155; }
    body.dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  </style>
</head>

<body>

<form id="loanForm">
  <h3>Loan Entry</h3>

  <label>Date</label>
  <input type="date" id="date" required>

  <label>Borrower</label>
  <select id="borrower" required>
    <option value="">Select</option>
    <option>Chinnama</option>
    <option>Grand Father</option>
    <option>Mother</option>
    <option>Pedhamma</option>
    <option>Ravi Babai</option>
    <option>Srinivas Babai</option>
    <option>Vasavi</option>
    <option>Other</option>
  </select>

  <input type="text" id="borrower_other" class="hidden" placeholder="Enter borrower name">

  <label>Narration</label>
  <input type="text" id="narration" required>

  <label>Invoice No.</label>
  <input type="text" id="invoice">

  <label>Transaction Type</label>
  <select id="trtype" required>
    <option value="">Select</option>
    <option value="loan_given">Loan Given</option>
    <option value="loan_received">Loan Received</option>
  </select>

  <label>Payment Mode</label>
  <select id="mode" required>
    <option value="">Select</option>
    <option value="cash">Cash</option>
    <option value="debit">Debit</option>
    <option value="upi">UPI</option>
    <option value="net">Net</option>
    <option value="credit">Credit</option>
  </select>

  <div id="accountBlock" class="hidden">
    <label>Account</label>
    <select id="account"></select>
  </div>

  <div id="cashBlock" class="cash-box hidden">
    <div class="cash-title">Cash Denominations</div>
    <div class="denom-grid" id="cashGrid"></div>
  </div>

  <div id="givenBlock" class="hidden">
    <label>Given Amount</label>
    <input type="number" id="given">
  </div>

  <div id="receivedBlock" class="hidden">
    <label>Received Amount</label>
    <input type="number" id="received">
  </div>

  <button type="submit">Save Loan</button>
  
  <div id="syncStatus"></div>
</form>

<script>
  /* ⚠️ REPLACE THIS WITH YOUR DEPLOYED SCRIPT URL */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkXPnWFXc9DCEF-p0P-tyO7bfs5TMh3WDmordo3YvVr5KcQ7Dr5wHljA1NlZZwtBtY/exec";
  
  let isSubmitting = false;

  /* ===== 1. INDEXED DB SETUP (OFFLINE STORAGE) ===== */
  const DB_NAME = "LoanAppDB";
  const STORE_NAME = "loanQueue";
  let db;

  const initDB = () => {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      
      request.onupgradeneeded = (event) => {
        db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        }
      };

      request.onsuccess = (event) => {
        db = event.target.result;
        resolve(db);
        checkPendingSync(); // Check for pending items on load
      };

      request.onerror = (event) => {
        console.error("DB Error", event);
        reject("DB Error");
      };
    });
  };

  const saveToQueue = (data) => {
    const transaction = db.transaction([STORE_NAME], "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    store.add(data);
    updateSyncStatus("pending", "Saved offline. Will sync when online.");
  };

  const getQueue = () => {
    return new Promise((resolve) => {
      const transaction = db.transaction([STORE_NAME], "readonly");
      const store = transaction.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
    });
  };

  const clearItem = (id) => {
    const transaction = db.transaction([STORE_NAME], "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    store.delete(id);
  };

  /* ===== 2. SYNC LOGIC ===== */
  const syncStatusDiv = document.getElementById("syncStatus");

  function updateSyncStatus(type, msg) {
    syncStatusDiv.style.display = "block";
    syncStatusDiv.className = ""; // clear classes
    syncStatusDiv.textContent = msg;
    
    if (type === "pending") syncStatusDiv.classList.add("sync-pending");
    if (type === "progress") syncStatusDiv.classList.add("sync-progress");
    if (type === "success") syncStatusDiv.classList.add("sync-success");
  }

  async function checkPendingSync() {
    const queue = await getQueue();
    if (queue.length > 0) {
      if (navigator.onLine) {
        processQueue(queue);
      } else {
        updateSyncStatus("pending", `⚠️ ${queue.length} entries waiting for network.`);
      }
    } else {
      syncStatusDiv.style.display = "none";
    }
  }

  async function processQueue(queue) {
    updateSyncStatus("progress", "🔄 Syncing data to server...");
    
    for (const item of queue) {
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(item)
        });
        // If successful, remove from DB
        clearItem(item.id);
      } catch (error) {
        console.error("Sync failed for item", item, error);
        // Stop processing if network fails mid-sync
        return; 
      }
    }
    
    // Check if queue is empty after loop
    const remaining = await getQueue();
    if (remaining.length === 0) {
      updateSyncStatus("success", "✅ All offline data synced successfully!");
      setTimeout(() => syncStatusDiv.style.display = "none", 3000);
    }
  }

  // Listen for network restoration
  window.addEventListener('online', checkPendingSync);
  
  // Init DB on load
  initDB();


  /* ===== 3. FORM LOGIC ===== */
  
  const date = document.getElementById("date");
  const borrower = document.getElementById("borrower");
  const borrowerOther = document.getElementById("borrower_other");
  const narration = document.getElementById("narration");
  const invoice = document.getElementById("invoice");
  const trtype = document.getElementById("trtype");
  const mode = document.getElementById("mode");
  const account = document.getElementById("account");
  const accountBlock = document.getElementById("accountBlock");
  const cashGrid = document.getElementById("cashGrid");
  const cashBlock = document.getElementById("cashBlock");
  const given = document.getElementById("given");
  const received = document.getElementById("received");
  const givenBlock = document.getElementById("givenBlock");
  const receivedBlock = document.getElementById("receivedBlock");
  const loanForm = document.getElementById("loanForm");

  // Init Date
  date.value = new Date().toISOString().split("T")[0];

  // Denominations
  const denoms = [500,200,100,50,20,10,5,2,1];
  denoms.forEach(d => {
    cashGrid.innerHTML += `
      <div class="denom-card">
        <div class="denom-label">₹${d}</div>
        <input type="number" min="0" value="0" data-val="${d}">
      </div>
    `;
  });

  // Accounts
  const bankAccounts = ["FI","HDFC Old","HDFC New","ICICI","RBL","Kotak","SBI","IndusInd"];
  const creditCards = ["Axis Flipkart","Axis MyZone","Axis Neo","HDFC PhonePe","HDFC Tata Neu","HDFC Millennia","HSBC","IDFC First Millenia","ICICI Amazon","ICICI Coral","ICICI Expressions","Indusind Plat Aura EDGE","Indusind Legend","Yes Finbooster","Kotak League","Kotak Image","SBI BPCL","Standard Chartered"];

  // Logic
  borrower.onchange = () => borrowerOther.classList.toggle("hidden", borrower.value !== "Other");

  // Cash Calculation
  cashGrid.addEventListener("input", () => {
    let total = 0;
    cashGrid.querySelectorAll("input").forEach(i => {
      total += Number(i.value || 0) * Number(i.dataset.val);
    });
    if (trtype.value === "loan_given") given.value = total || "";
    if (trtype.value === "loan_received") received.value = total || "";
  });

  mode.onchange = () => {
    account.innerHTML = "";
    cashBlock.classList.add("hidden");
    cashGrid.querySelectorAll("input").forEach(i => i.value = 0);

    if (mode.value === "cash") {
      accountBlock.classList.add("hidden");
      cashBlock.classList.remove("hidden");
      given.disabled = true;
      received.disabled = true;
      return;
    }

    accountBlock.classList.remove("hidden");
    const list = mode.value === "credit" ? creditCards : bankAccounts;
    list.forEach(a => account.add(new Option(a, a)));
    given.disabled = false;
    received.disabled = false;
  };

  trtype.onchange = () => {
    given.value = received.value = "";
    givenBlock.classList.add("hidden");
    receivedBlock.classList.add("hidden");

    if (trtype.value === "loan_given") {
      givenBlock.classList.remove("hidden");
      given.disabled = mode.value === "cash";
    }
    if (trtype.value === "loan_received") {
      receivedBlock.classList.remove("hidden");
      received.disabled = mode.value === "cash";
    }
  };

  /* ===== 4. SUBMIT HANDLER ===== */
  loanForm.addEventListener("submit", async e => {
    e.preventDefault();

    // VALIDATION
    const type = trtype.value;
    const gVal = Number(given.value);
    const rVal = Number(received.value);

    if (type === "loan_given" && (gVal <= 0 || !given.value)) {
      alert("⚠️ Please enter a valid Given Amount.");
      given.focus();
      return;
    }

    if (type === "loan_received" && (rVal <= 0 || !received.value)) {
      alert("⚠️ Please enter a valid Received Amount.");
      received.focus();
      return;
    }

    if (isSubmitting) return;

    // PREPARE PAYLOAD
    const payload = {
      date: date.value,
      borrower: borrower.value === "Other" ? borrowerOther.value : borrower.value,
      narration: narration.value,
      invoice: invoice.value,
      mode: mode.value,
      trtype: trtype.value,
      account: mode.value === "cash" ? "Cash" : account.value,
      withdrawn: given.value,
      deposit: received.value
    };

    cashGrid.querySelectorAll("input").forEach(i => {
      payload["c" + i.dataset.val] = i.value || 0;
    });

    isSubmitting = true;
    const submitBtn = loanForm.querySelector("button");
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";

    const resetForm = () => {
      const keepDate = date.value;
      loanForm.reset();
      date.value = keepDate;
      borrowerOther.classList.add("hidden");
      accountBlock.classList.add("hidden");
      cashBlock.classList.add("hidden");
      givenBlock.classList.add("hidden");
      receivedBlock.classList.add("hidden");
      cashGrid.querySelectorAll("input").forEach(i => i.value = 0);
    };

    // --- LOGIC SPLIT: ONLINE vs OFFLINE ---
    
    if (!navigator.onLine) {
      // OFFLINE MODE
      saveToQueue(payload);
      alert("⚠️ No internet connection.\nEntry saved offline. It will sync when connection is restored.");
      resetForm();
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    } else {
      // ONLINE MODE
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error("Server error");
        const text = await response.text();
        alert(text);
        resetForm();

      } catch (err) {
        console.error("Submission Failed, attempting offline save", err);
        // Fallback: If fetch fails (e.g. timeout), save to DB
        saveToQueue(payload);
        alert("❌ Connection unstable.\nSaved offline. Will sync automatically.");
        resetForm();
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }
  });

  /* Dark Mode */
  let lastTap = 0;
  document.addEventListener("dblclick", () => document.body.classList.toggle("dark"));
  document.addEventListener("touchend", () => {
    const now = Date.now();
    if (now - lastTap < 300) document.body.classList.toggle("dark");
    lastTap = now;
  });

</script>

</body>
</html>
