<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Entry (Optimized UI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root { --primary: #22c55e; --primary-hover: #16a34a; --danger: #ef4444; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
      padding: 20px; margin: 0; min-height: 100vh;
    }

    form {
      background: #ffffff; max-width: 440px; margin: auto; padding: 22px;
      border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.08);
    }

    h3 { text-align: center; margin-bottom: 16px; margin-top: 0; color: #111827; }
    label { font-size: 13px; font-weight: 600; margin-top: 14px; display:block; color: #374151; }

    input, select, button {
      width: 100%; height: 44px; margin-top: 6px; padding: 0 14px;
      border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; box-sizing: border-box;
    }

    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(34,197,94,.15); }

    .was-validated input:invalid, .was-validated select:invalid,
    input.manual-invalid, select.manual-invalid { border-color: var(--danger); background-color: #fffafb; }
    .err-msg { color: var(--danger); font-size: 11px; margin-top: 4px; display: none; font-weight: 500; }
    .was-validated :invalid ~ .err-msg, .manual-invalid ~ .err-msg { display: block; }

    button { background: var(--primary); color: #fff; border: none; margin-top: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .hidden { display: none !important; }

    /* Cash Grid */
    .cash-box { margin-top: 16px; padding: 18px; border-radius: 16px; background: #f9fafb; border: 1px solid #e5e7eb; }
    .denom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .denom-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 5px; text-align: center; }
    .denom-label { font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #6b7280; }
    .denom-card input { height: 32px; text-align: center; margin-top: 0; border-radius: 6px; }

    /* Sync UI Row */
    .sync-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; }
    #syncIndicator { font-size: 12px; color: #4b5563; font-weight: 600; background: #f3f4f6; padding: 6px 12px; border-radius: 20px; }
    #btnViewQueue { width: auto; height: 30px; font-size: 11px; background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 0 12px; margin-top: 0; }

    /* Modal Spacing Refinement */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; justify-content: center; align-items: center; }
    .modal-content { background: #fff; width: 95%; max-width: 850px; max-height: 85vh; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f3f4f6; padding: 10px 20px; }
    .modal-header h4 { margin: 0; color: #111827; font-size: 15px; }
    .close-modal { font-size: 24px; cursor: pointer; color: #9ca3af; }

    .table-container { overflow-x: auto; flex-grow: 1; background: #fff; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 750px; table-layout: fixed; border-top: none; }
    th { background: #f8fafc; color: #64748b; font-weight: 600; text-align: center; padding: 10px; border-bottom: 1px solid #e5e7eb; text-transform: uppercase; font-size: 10px; }
    
    td { padding: 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; text-align: center; color: #374151; height: 1px; }
    
    .action-cell-container { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; }
    
    .btn-del-mini { 
      background: #fee2e2; color: #ef4444; border: none; width: 32px; height: 32px; 
      border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
    }

    .amt-val { font-weight: 700; font-size: 13px; }

    body.dark { background: #020617; }
    body.dark form, body.dark .modal-content { background: #0f172a; color: #e5e7eb; border: 1px solid #334155; }
    body.dark input, body.dark select { background: #1e293b; color: #f9fafb; border-color: #334155; }
    body.dark th { background: #1e293b; border-bottom-color: #334155; }
    body.dark #btnViewQueue { background: #1e293b; color: #e5e7eb; border-color: #334155; }
  </style>
</head>

<body>

<form id="loanForm" novalidate>
  <h3>Loan Entry</h3>

  <label>Date</label>
  <input type="date" id="date" required>
  <div class="err-msg">Select a date</div>

  <label>Borrower</label>
  <select id="borrower" required>
    <option value="">Select</option>
    <option>Chinnama</option><option>Grand Father</option><option>Mother</option><option>Pedhamma</option><option>Ravi Babai</option><option>Srinivas Babai</option><option>Vasavi</option><option value="Other">Other</option>
  </select>
  <div class="err-msg">Select a borrower</div>
  
  <div id="otherGroup" class="hidden">
    <label>Borrower Name</label>
    <input type="text" id="borrower_other" placeholder="Enter name">
    <div class="err-msg">Name is required</div>
  </div>

  <label>Narration</label>
  <input type="text" id="narration" required placeholder="Reason for loan">
  <div class="err-msg">Narration is required</div>

  <label>Invoice No.</label>
  <input type="text" id="invoice" placeholder="Optional">

  <label>Transaction Type</label>
  <select id="trtype" required>
    <option value="">Select</option>
    <option value="loan_given">Loan Given</option>
    <option value="loan_received">Loan Received</option>
  </select>
  <div class="err-msg">Select type</div>

  <label>Payment Mode</label>
  <select id="mode" required>
    <option value="">Select</option>
    <option value="cash">Cash</option><option value="debit">Debit</option><option value="upi">UPI</option><option value="net">Net</option><option value="credit">Credit</option><option value="Rewards">Rewards</option>
  </select>

  <div id="accountBlock" class="hidden">
    <label>Account</label>
    <select id="account" required><option value="">Select Account</option></select>
    <div class="err-msg">Select an account</div>
  </div>

  <div id="accountOtherBlock" class="hidden">
    <label>Platform Name</label>
    <input type="text" id="account_other" placeholder="Enter platform name">
    <div class="err-msg">Name is required</div>
  </div>

  <div id="cashBlock" class="cash-box hidden">
    <div class="denom-grid" id="cashGrid"></div>
  </div>

  <div id="amtBlock" class="hidden">
    <label id="amtLabel">Amount</label>
    <input type="number" id="amtInput" step="0.01">
    <div class="err-msg">Amount must be greater than zero</div>
  </div>

  <button type="submit" id="mainSubmitBtn">Save Loan</button>
  
  <div class="sync-wrapper">
    <div id="syncIndicator" class="hidden"></div>
    <button type="button" id="btnViewQueue" class="hidden">View Pending</button>
  </div>
</form>

<div id="queueModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h4>Pending Sync Queue</h4>
      <span class="close-modal">&times;</span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Date</th>
            <th style="width:120px">Borrower</th>
            <th>Narration</th>
            <th style="width:130px">Mode</th>
            <th style="width:110px">Amount</th>
            <th style="width:65px">Del</th>
          </tr>
        </thead>
        <tbody id="queueTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqPjzifT1pGTVRBv9zPT7KtbTqthUunk1zNEPuS_-4gHPghWfGonbndTnZXFsSgbe-vQ/exec";
  let isSubmitting = false;

  const form = document.getElementById("loanForm"), date = document.getElementById("date"), borrower = document.getElementById("borrower"), borrowerOther = document.getElementById("borrower_other"), otherGroup = document.getElementById("otherGroup"), narration = document.getElementById("narration"), invoice = document.getElementById("invoice"), trtype = document.getElementById("trtype"), mode = document.getElementById("mode"), account = document.getElementById("account"), accountBlock = document.getElementById("accountBlock"), accountOther = document.getElementById("account_other"), accountOtherBlock = document.getElementById("accountOtherBlock"), cashGrid = document.getElementById("cashGrid"), cashBlock = document.getElementById("cashBlock"), amtInput = document.getElementById("amtInput"), amtBlock = document.getElementById("amtBlock"), amtLabel = document.getElementById("amtLabel"), submitBtn = document.getElementById("mainSubmitBtn");
  const syncIndicator = document.getElementById("syncIndicator"), btnViewQueue = document.getElementById("btnViewQueue"), queueModal = document.getElementById("queueModal"), queueTableBody = document.getElementById("queueTableBody"), closeModal = document.querySelector(".close-modal");

  const DB_NAME = "LoanAppDB", STORE_NAME = "loanQueue";
  let db;
  (function initDB(){
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; updatePendingCount(); if(navigator.onLine) syncOffline(); };
  })();

  async function updatePendingCount(){
    if(!db) return;
    const tx = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll();
    tx.onsuccess = () => {
      const items = tx.result;
      syncIndicator.classList.toggle("hidden", !items.length);
      btnViewQueue.classList.toggle("hidden", !items.length);
      if(items.length) syncIndicator.textContent = `⏳ ${items.length} waiting to sync`;
    };
  }

  date.value = new Date().toISOString().split("T")[0];
  const denoms = [500,200,100,50,20,10,5,2,1];
  denoms.forEach(d => {
    cashGrid.innerHTML += `<div class="denom-card"><div class="denom-label">₹${d}</div><input type="number" value="0" data-val="${d}"></div>`;
  });

  const accounts = ["FI","HDFC Old","HDFC New","ICICI","RBL","Kotak","SBI","IndusInd"];
  const rewardPlatforms = ["Amazon", "Flipkart", "Supermoney", "Payzapp", "MobiKwik", "Tata Neu", "Others"];

  borrower.onchange = () => {
    const isOther = borrower.value === "Other";
    otherGroup.classList.toggle("hidden", !isOther);
    borrowerOther.required = isOther;
  };

function updateTotals() {
  let total = 0;
  cashGrid.querySelectorAll("input").forEach(i => total += Number(i.value || 0) * Number(i.dataset.val));
  if (mode.value === "cash") {
      amtInput.value = total;
      // Remove the manual-invalid class if total > 0
      if(total > 0) amtInput.classList.remove("manual-invalid");
  }
}
  cashGrid.addEventListener("input", updateTotals);

mode.onchange = () => {
  const m = mode.value;
  const isCash = m === "cash";
  // Fixed case sensitivity for "Rewards"
  const isRewards = m.toLowerCase() === "rewards"; 
  
  cashBlock.classList.toggle("hidden", !isCash);
  accountBlock.classList.toggle("hidden", isCash || m === "");
  
  // CRITICAL FIX: Disable 'required' when hidden so validation passes
  account.required = !isCash && m !== ""; 
  
  accountOtherBlock.classList.add("hidden");
  accountOther.required = false;

  amtInput.readOnly = isCash;
  
  if (!isCash && m !== "") {
    account.innerHTML = "<option value=''>Select Account</option>";
    const list = isRewards ? rewardPlatforms : accounts;
    list.forEach(a => account.add(new Option(a, a)));
  }
  updateTotals();
};
  account.onchange = () => {
    const isOther = account.value === "Others";
    accountOtherBlock.classList.toggle("hidden", !isOther);
    accountOther.required = isOther;
  };

  trtype.onchange = () => {
    amtBlock.classList.toggle("hidden", trtype.value === "");
    amtLabel.textContent = trtype.value === "loan_given" ? "Given Amount" : "Received Amount";
    updateTotals();
  };

  form.onsubmit = async e => {
    e.preventDefault();
    form.classList.add("was-validated");
    const isAmtValid = parseFloat(amtInput.value) > 0;
    amtInput.classList.toggle("manual-invalid", !isAmtValid);

    if (!form.checkValidity() || !isAmtValid) return;
    if (isSubmitting) return;

    const finalAccount = mode.value === "cash" ? "Cash" : (account.value === "Others" ? accountOther.value : account.value);

    const payload = {
      date: date.value, borrower: borrower.value === "Other" ? borrowerOther.value : borrower.value,
      narration: narration.value, invoice: invoice.value, mode: mode.value, trtype: trtype.value,
      account: finalAccount, withdrawn: trtype.value === "loan_given" ? amtInput.value : 0, deposit: trtype.value === "loan_received" ? amtInput.value : 0
    };
    cashGrid.querySelectorAll("input").forEach(i => payload["c" + i.dataset.val] = i.value || 0);

    isSubmitting = true; submitBtn.textContent = "Processing...";
    
    if (!navigator.onLine) {
      db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).add(payload);
      alert("Saved offline!"); resetForm();
    } else {
      try {
        await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        alert("Success!"); resetForm();
      } catch {
        db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).add(payload);
        alert("Saved to queue."); resetForm();
      }
    }
    isSubmitting = false; submitBtn.textContent = "Save Loan"; updatePendingCount();
  };

  function resetForm() {
    form.reset();
    form.classList.remove("was-validated");
    amtInput.classList.remove("manual-invalid");
    otherGroup.classList.add("hidden"); accountBlock.classList.add("hidden"); accountOtherBlock.classList.add("hidden"); cashBlock.classList.add("hidden"); amtBlock.classList.add("hidden");
    date.value = new Date().toISOString().split("T")[0];
  }

  function renderQueueTable() {
    queueTableBody.innerHTML = "<tr><td colspan='6'>Refreshing...</td></tr>";
    const tx = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll();
    tx.onsuccess = () => {
      const items = tx.result;
      queueTableBody.innerHTML = items.length ? "" : "<tr><td colspan='6'>Queue is empty</td></tr>";
      items.forEach(item => {
        const tr = document.createElement("tr");
        const amt = item.trtype === "loan_given" ? `-${item.withdrawn}` : `+${item.deposit}`;
        tr.innerHTML = `
          <td>${item.date}</td>
          <td style="font-weight:600">${item.borrower}</td>
          <td>${item.narration}</td>
          <td>
             <div style="font-weight:600">${item.mode.toUpperCase()}</div>
             <div style="font-size:10px; color:#94a3b8">(${item.account})</div>
          </td>
          <td class="amt-val" style="color:${item.trtype==='loan_given'?'#dc2626':'#16a34a'}">${amt}</td>
          <td>
            <div class="action-cell-container">
               <button class="btn-del-mini" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </td>`;
        queueTableBody.appendChild(tr);
      });
    };
  }

  window.deleteItem = id => {
    if(confirm("Delete?")) {
      db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).delete(id);
      renderQueueTable(); updatePendingCount();
    }
  };

  btnViewQueue.onclick = () => { renderQueueTable(); queueModal.classList.remove("hidden"); };
  closeModal.onclick = () => queueModal.classList.add("hidden");

  async function syncOffline(){
    if (!navigator.onLine || !db) return;
    const request = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll();
    request.onsuccess = async () => {
      const items = request.result;
      for (const item of items) {
        try { 
          await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(item) }); 
          db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).delete(item.id); 
        } 
        catch { break; }
      }
      updatePendingCount();
    };
  }

  window.addEventListener('online', syncOffline);
  document.addEventListener("dblclick", () => document.body.classList.toggle("dark"));
</script>
</body>
</html>
